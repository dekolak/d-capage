# Production sur le VPS (Coolify, build pack « Docker Compose », fichier /docker-compose.prod.yml).
#
# Routage par le PROXY DE COOLIFY (n8n est aussi géré par Coolify) : dans Coolify, service « app »,
# Domains = https://app.lazzeko.com:3000,https://app.kiavikcopilot.ovh:3000 (le « :3000 » = port du conteneur).
# Coolify ajoute lui-même les labels Traefik et le certificat HTTPS : pas de labels ni de réseau externe ici.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: decapage
      POSTGRES_USER: decapage
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}"
    volumes:
      - decapage_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decapage -d decapage"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://decapage:${POSTGRES_PASSWORD}@db:5432/decapage?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant}"
      ADMIN_IDENTIFIANT: ${ADMIN_IDENTIFIANT:-admin}
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}"
      UPLOAD_DIR: /data/uploads
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-https://app.lazzeko.com}
      MODERATION_PREALABLE_AVIS: ${MODERATION_PREALABLE_AVIS:-false}
    volumes:
      - decapage_uploads:/data/uploads
    expose:
      - "3000"

volumes:
  decapage_db:
  decapage_uploads:

