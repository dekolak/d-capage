<!--
  Lazzeko · Présentation animée de l'app « Réglages décapage »
  À coller dans un bloc « Code HTML » d'Odoo (ou à ouvrir tel quel dans un navigateur).

<div id="lzp">
<style>
#lzp{--o:#f15a21;--od:#d9480f;--od2:#fff1ea;--t:#1c1d21;--g:#6f7280;--f:#f5f5f7;--b:#e6e6ea;--p:#5a6b8e;--mf:#e2e8f3;--mc:#f3f5fa;
 font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--t);max-width:1100px;margin:0 auto;padding:24px 14px;box-sizing:border-box;line-height:1.45;text-align:left}
#lzp *{box-sizing:border-box}
#lzp h2,#lzp h3,#lzp p{font-family:inherit;color:inherit;text-transform:none;letter-spacing:normal;margin:0}
#lzp button{font-family:inherit;margin:0;line-height:1.2;text-transform:none;letter-spacing:normal;box-shadow:none}
#lzp .scene{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:center;min-height:620px}
#lzp .txt .kick{color:var(--o);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#lzp .txt h2{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px}
#lzp .txt p{font-size:17px;color:#3f414a;max-width:460px}
#lzp .txt ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
#lzp .txt li{display:flex;gap:10px;font-size:15px;color:#3f414a}
#lzp .txt li:before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--o)}
#lzp .txt>*{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
#lzp .on .txt>*{opacity:1;transform:none}
#lzp .on .txt>*:nth-child(2){transition-delay:.08s}#lzp .on .txt>*:nth-child(3){transition-delay:.16s}#lzp .on .txt>*:nth-child(4){transition-delay:.24s}
/* ---------- téléphone ---------- */
#lzp .tel{width:300px;height:610px;margin:0 auto;border-radius:44px;background:#16171b;padding:12px;box-shadow:0 30px 60px rgba(20,20,30,.25),inset 0 0 0 2px #2a2b31;position:relative}
#lzp .tel:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:84px;height:22px;border-radius:12px;background:#000;z-index:5}
#lzp .ecran{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--f)}
#lzp .haut{height:44px}
#lzp .contenu{padding:6px 14px 0;height:calc(100% - 44px - 70px);overflow:hidden;position:relative}
#lzp .h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 10px}
#lzp .muted{color:var(--g);font-size:11px}
#lzp .nav{position:absolute;left:8px;right:8px;bottom:8px;height:58px;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 6px 20px rgba(20,20,30,.12);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:8.5px;color:var(--g);font-weight:600}
#lzp .nav span{display:grid;justify-items:center;gap:2px;padding:4px 0;border-radius:12px}
#lzp .nav i{display:block;width:18px;height:18px;border-radius:6px;border:2px solid currentColor}
#lzp .nav .plus i{background:var(--o);border-color:var(--o);border-radius:7px}
#lzp .nav .act{color:var(--o);background:var(--od2)}
#lzp .carte{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(20,20,30,.04),0 4px 14px rgba(20,20,30,.06);padding:9px;margin-bottom:8px}
#lzp .fiche{display:flex;gap:9px;align-items:center}
#lzp .vg{width:50px;height:50px;border-radius:10px;flex:none;background:linear-gradient(135deg,#8d6e63,#c7a17a)}
#lzp .vg.b{background:linear-gradient(135deg,#90a4ae,#cfd8dc)}#lzp .vg.c{background:linear-gradient(135deg,#6d4c41,#ff8a50)}
#lzp .fiche b{font-size:12px;display:block}
#lzp .tags{display:flex;gap:4px;margin:3px 0}
#lzp .tg{font-size:9px;background:#f0f0f3;border-radius:99px;padding:1px 6px;color:#44464f}
#lzp .st{color:#f5a623;font-size:11px;letter-spacing:1px}#lzp .st em{color:#dcdce2;font-style:normal}
#lzp .etapes{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-bottom:10px;text-align:center;font-size:7.5px;color:#9a9daa;font-weight:600}
#lzp .etapes span{display:grid;justify-items:center;gap:2px}
#lzp .etapes b{width:18px;height:18px;border-radius:50%;background:#e9e9ee;color:var(--g);display:flex;align-items:center;justify-content:center;font-size:9px}
#lzp .etapes .f b{background:#ffe1d3;color:var(--od)}#lzp .etapes .o{color:var(--o)}#lzp .etapes .o b{background:var(--o);color:#fff}
#lzp .lbl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g);margin:8px 0 4px}
#lzp .sel{height:34px;border:1px solid #d4d5db;border-radius:10px;background:#fff;font-size:12px;display:flex;align-items:center;padding:0 10px;justify-content:space-between}

#lzp .chips{display:flex;gap:5px;margin-top:5px;min-height:20px}
#lzp .chip{font-size:10px;font-weight:600;color:var(--od);background:var(--od2);border:1px solid #fbd0bd;border-radius:99px;padding:2px 8px}
#lzp .bphoto{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px;background:var(--o);color:#fff;box-shadow:0 5px 14px rgba(241,90,33,.3);margin-top:8px}
#lzp .bphoto svg{width:28px;height:28px;flex:none}
#lzp .bphoto b{font-size:15px;font-weight:800;text-transform:uppercase;display:block}
#lzp .bphoto small{font-size:9px;opacity:.9}
#lzp .bphoto.ok{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}
#lzp .galerie{display:flex;gap:6px;margin-top:10px}
#lzp .thumb{width:70px;height:70px;border-radius:10px}
#lzp .btnl{height:30px;border:1px solid #d4d5db;border-radius:10px;background:#fff;font-size:11px;font-weight:650;display:flex;align-items:center;justify-content:center;margin-top:6px}
#lzp .barre{position:absolute;left:8px;right:8px;bottom:74px;display:grid;grid-template-columns:1fr 2fr;gap:6px;padding:6px;border-radius:14px;background:rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(20,20,30,.1)}
#lzp .barre span{height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid #d4d5db;background:#fff}
#lzp .barre .p{background:var(--o);border-color:var(--o);color:#fff}
/* miroir */
#lzp .mir{background:var(--mf);border-radius:14px;padding:6px 7px 8px}
#lzp .mir .logo{text-align:center;color:#f08a3c;font-weight:700;letter-spacing:.12em;font-size:9px;margin:2px 0 5px}
#lzp .mc{background:var(--mc);border-radius:10px;padding:1px 8px;margin-bottom:5px}
#lzp .mc.d{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#lzp .ml{font-size:9.5px;color:#1d2433;padding:4px 0;border-bottom:1px solid #b8c1d2}
#lzp .ml:last-child{border-bottom:0}
#lzp .pv{display:block;margin-top:2px;background:var(--p);color:#fff;border-radius:99px;text-align:center;font-size:11px;padding:2px 0;font-variant-numeric:tabular-nums;transition:box-shadow .2s}
#lzp .pv.sc{border-radius:7px;height:24px;display:flex;align-items:center;justify-content:center}
#lzp .pv.sel2{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--o)}
#lzp .feuille{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(20,20,30,.15);padding:16px 14px 16px;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:4}
#lzp .feuille.up{transform:none}
#lzp .feuille:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:30px;height:4px;border-radius:2px;background:#d4d5db}
#lzp .feuille b{font-size:13px}
#lzp .feuille p{font-size:10px;color:#4b4e58;margin:4px 0 8px}
#lzp .ctl{display:flex;gap:6px;align-items:center}
#lzp .ctl span{width:34px;height:34px;border-radius:10px;background:#f0f0f3;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
#lzp .ctl .val{flex:1;height:34px;border:1px solid var(--o);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;box-shadow:0 0 0 3px rgba(241,90,33,.2);font-variant-numeric:tabular-nums}
#lzp .curseur{position:relative;height:4px;border-radius:2px;background:#d9d9de;margin:14px 2px 6px}
#lzp .curseur i{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--o);width:85%;transition:width .9s}
#lzp .curseur u{position:absolute;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--o);left:calc(85% - 8px);transition:left .9s}
#lzp .feuille .bt{display:grid;grid-template-columns:1fr 2fr;gap:6px;margin-top:10px}
#lzp .feuille .bt span{height:30px;border-radius:9px;border:1px solid #d4d5db;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
#lzp .feuille .bt .p{background:var(--o);border-color:var(--o);color:#fff}
#lzp .indic{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
#lzp .indic div{background:#fff;border-radius:8px;padding:4px 6px;box-shadow:0 1px 6px rgba(20,20,30,.06)}
#lzp .indic small{display:block;font-size:7px;font-weight:700;color:var(--g);text-transform:uppercase}
#lzp .indic b{font-size:12px}
#lzp .etoiles{font-size:26px;color:#dcdce2;letter-spacing:2px;margin:6px 0}
#lzp .etoiles i{font-style:normal;transition:color .2s,transform .2s;display:inline-block}
#lzp .etoiles i.on{color:#f5a623;transform:scale(1.15)}
#lzp .champ{height:32px;border:1px solid #d4d5db;border-radius:10px;background:#fff;font-size:11px;display:flex;align-items:center;padding:0 10px;margin-top:4px}
#lzp .toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:#1f8a44;color:#fff;font-size:11px;font-weight:700;padding:8px 14px;border-radius:99px;opacity:0;transition:.35s;white-space:nowrap;z-index:6}
#lzp .toast.v{opacity:1;transform:translate(-50%,0)}
#lzp .seg{display:grid;grid-template-columns:1fr 1fr;background:#ebebef;border-radius:10px;padding:2px;margin-bottom:8px}
#lzp .seg span{text-align:center;font-size:10px;font-weight:700;padding:6px 0;border-radius:8px;color:var(--g)}
#lzp .seg .on2{background:#fff;color:var(--t);box-shadow:0 1px 3px rgba(20,20,30,.12)}
#lzp .acc{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(20,20,30,.06);padding:9px 10px;margin-bottom:6px;font-size:11.5px;font-weight:700;display:flex;justify-content:space-between}
#lzp .acc:after{content:"+";color:#9a9daa;font-weight:400}
#lzp .acc.ouv{display:block}#lzp .acc.ouv:after{content:none}
#lzp .acc.ouv p{font-size:9.5px;font-weight:400;color:#3f414a;margin:5px 0}
#lzp .train{height:30px;background:var(--f);border-radius:8px;overflow:hidden;position:relative;margin-top:4px}
#lzp .train div{position:absolute;bottom:3px;left:0;width:200%;height:24px;display:flex;align-items:flex-end;animation:lzdef 3s linear infinite}
#lzp .train i{flex:none;margin-right:16px;width:5px;border-radius:2px;background:var(--o)}
@keyframes lzdef{to{transform:translateX(-50%)}}
/* animations d'apparition */
#lzp .pop{opacity:0;transform:translateY(12px) scale(.98);transition:opacity .4s,transform .4s}
#lzp .pop.v{opacity:1;transform:none}
/* doigt */
#lzp .doigt{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(241,90,33,.25);border:2px solid rgba(241,90,33,.9);pointer-events:none;z-index:7;opacity:0;transition:left .6s ease,top .6s ease,opacity .3s;transform:translate(-50%,-50%)}
#lzp .doigt.v{opacity:1}
#lzp .doigt.tap{animation:lztap .45s}
@keyframes lztap{50%{transform:translate(-50%,-50%) scale(.7);background:rgba(241,90,33,.55)}}
#lzp .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#lzp .flash.go{animation:lzflash .5s}
@keyframes lzflash{30%{opacity:.9}}
/* intro / fin */
#lzp .intro{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#fff 0%,#fff1ea 100%);padding:20px}
#lzp .intro .ic{width:76px;height:76px;border-radius:22px;background:var(--o);box-shadow:0 10px 24px rgba(241,90,33,.35);display:flex;align-items:center;justify-content:center}
#lzp .intro h3{font-size:22px;font-weight:800;margin:14px 0 6px}
#lzp .intro p{font-size:12px;color:var(--g)}
/* commandes */
#lzp .cmd{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
#lzp .cmd button{border:1px solid #d4d5db;background:#fff;border-radius:12px;min-width:44px;height:44px;font-size:18px;cursor:pointer;padding:0 12px}
#lzp .cmd button.lect{background:var(--o);border-color:var(--o);color:#fff;font-size:14px;font-weight:700;min-width:110px}
#lzp .points{display:flex;gap:6px}
#lzp .points button{width:10px;min-width:10px;height:10px;padding:0;border-radius:99px;border:0;background:#d4d5db;transition:width .3s,background .3s}
#lzp .points button.on{width:28px;background:var(--o)}
#lzp .prog{height:3px;background:#ebebef;border-radius:2px;margin-top:14px;overflow:hidden}
#lzp .prog i{display:block;height:100%;width:0;background:var(--o)}
#lzp .cta{display:inline-flex;margin-top:18px;background:var(--o);color:#fff;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:12px;box-shadow:0 6px 16px rgba(241,90,33,.3)}
/* bulles d'annotation, légendes, avis */
#lzp .bulle{position:absolute;left:14px;right:14px;z-index:6;background:#1c1d21;color:#fff;font-size:11px;font-weight:600;line-height:1.3;padding:8px 10px;border-radius:12px;box-shadow:0 8px 20px rgba(20,20,30,.25);opacity:0;transform:translateY(8px) scale(.97);transition:opacity .35s,transform .35s;display:flex;gap:7px;align-items:flex-start}
#lzp .bulle.v{opacity:1;transform:none}
#lzp .bulle:before{content:"";flex:none;width:8px;height:8px;margin-top:3px;border-radius:50%;background:var(--o)}
#lzp .bulle:after{content:"";position:absolute;top:-6px;left:34px;border:6px solid transparent;border-top:0;border-bottom-color:#1c1d21}
#lzp .bulle.bas:after{top:auto;bottom:-6px;border-bottom:0;border-top:6px solid #1c1d21}
#lzp .vignette{display:grid;gap:3px;justify-items:center}
#lzp .leg{font-size:8.5px;font-weight:700;color:var(--od);background:var(--od2);border-radius:99px;padding:1px 7px}
#lzp .cite{display:block;font-size:9px;color:#4b4e58;font-style:italic;margin-top:2px}
#lzp .comm{min-height:44px;border:1px solid #d4d5db;border-radius:10px;background:#fff;font-size:10.5px;padding:7px 9px;margin-top:4px;line-height:1.35}
#lzp .comm.f{border-color:var(--o);box-shadow:0 0 0 3px rgba(241,90,33,.18)}
#lzp .comm u{text-decoration:none;border-right:1.5px solid var(--o);animation:lzcur .8s steps(2) infinite}
@keyframes lzcur{50%{border-color:transparent}}
#lzp .duo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
#lzp .duo div{height:74px;border-radius:10px;position:relative}
#lzp .duo span{position:absolute;left:5px;bottom:5px;font-size:8px;font-weight:800;color:#fff;background:rgba(20,20,30,.55);border-radius:99px;padding:1px 6px;text-transform:uppercase}
#lzp .avis{background:#fff;border-radius:10px;padding:6px 8px;margin-bottom:5px;box-shadow:0 1px 6px rgba(20,20,30,.06);font-size:9.5px}
#lzp .avis b{font-size:10px}
#lzp .avis p{margin:2px 0 0;color:#3f414a;font-size:9.5px}
#lzp .moy{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
#lzp .ex{position:absolute;top:20px;right:24px;font-size:8px;font-weight:700;color:var(--g);background:#ebebef;border-radius:99px;padding:1px 6px;z-index:3}
#lzp .note-ex{text-align:center;font-size:11px;color:var(--g);margin-top:10px}
@media (max-width:800px){
 #lzp .scene{grid-template-columns:1fr;gap:20px;min-height:0}
 #lzp .txt{text-align:center}#lzp .txt p{margin:0 auto}#lzp .txt ul{justify-items:center}#lzp .txt h2{font-size:26px}
 #lzp .txt li{text-align:left}
 #lzp .tel{transform:scale(.92);transform-origin:top center;margin-bottom:-40px}
}
@media (prefers-reduced-motion:reduce){#lzp *{transition:none!important;animation:none!important}}
</style>

<div class="scene" id="lzpScene">
  <div class="txt" id="lzpTxt"></div>
  <div class="tel"><div class="ecran" id="lzpEcran"></div></div>
</div>
<div class="prog"><i id="lzpProg"></i></div>
<div class="cmd">
  <button type="button" id="lzpPrec" aria-label="Étape précédente">‹</button>
  <button type="button" class="lect" id="lzpLect">❚❚ Pause</button>
  <button type="button" id="lzpSuiv" aria-label="Étape suivante">›</button>
  <div class="points" id="lzpPoints"></div>
</div>
<p class="note-ex">Écrans, réglages et avis présentés à titre d'exemple.</p>

<script>
(function(){
"use strict";
var APP_URL='https://app.lazzeko.com';
var R=document.getElementById('lzp'),E=document.getElementById('lzpEcran'),T=document.getElementById('lzpTxt'),S=document.getElementById('lzpScene');
var minuteurs=[],idx=0,lecture=true,debut=0,raf=0;
function apres(ms,f){minuteurs.push(setTimeout(f,ms))}
function stop(){minuteurs.forEach(clearTimeout);minuteurs=[]}
function q(s){return E.querySelector(s)}
function voir(s){var e=q(s);if(e)e.classList.add('v')}
/* doigt : se déplace vers un élément puis « tape » */
function taper(sel,ms,f){apres(ms,function(){var d=q('.doigt'),c=q(sel);if(!d||!c)return;var re=E.getBoundingClientRect(),rc=c.getBoundingClientRect(),k=re.width/E.offsetWidth;
 d.style.left=((rc.left-re.left)/k+rc.width/k/2)+'px';d.style.top=((rc.top-re.top)/k+rc.height/k/2)+'px';d.classList.add('v');
 apres(650,function(){d.classList.remove('tap');void d.offsetWidth;d.classList.add('tap');if(f)f(c)})})}
var CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.8"/></svg>';
function nav(a){var n=['Mes fiches','Nouvelle','Communauté','Aide','Compte'];return '<div class="nav">'+n.map(function(x,i){return '<span class="'+(i===1?'plus ':'')+(i===a?'act':'')+'"><i></i>'+x+'</span>'}).join('')+'</div>'}
function etapes(o){var n=['Machine','Surface','Avant','Réglages','Écran','Résultat'];return '<div class="etapes">'+n.map(function(x,i){return '<span class="'+(i<o?'f':i===o?'o':'')+'"><b>'+(i+1)+'</b>'+x+'</span>'}).join('')+'</div>'}
function barre(t){return '<div class="barre"><span>‹ Retour</span><span class="p">'+(t||'Suivant ›')+'</span></div>'}
