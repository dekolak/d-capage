<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur FlexiPRINT DXonJet — V1 de travail</title>
<style>
:root{--bg:#f3f2ee;--ink:#1e2228;--mut:#6b7078;--line:#d9d6cf;--acc:#e8541e;--acc2:#1f6feb;--ok:#1a8f4c;--side:#1c2027}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--side);color:#e8e8e8;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:15px;margin:0 6px 4px;letter-spacing:.3px}
aside .sub{font-size:11px;color:#9aa0a8;margin:0 6px 14px}
.navbtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#d6d8dc;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.navbtn:hover{background:#2a3039}
.navbtn.on{background:var(--acc);color:#fff}
.navbtn .code{font-weight:700;font-size:11px;min-width:30px;padding:2px 5px;border-radius:4px;background:#ffffff1a;text-align:center}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7d848e;margin:14px 8px 4px}
main{padding:22px 26px 60px;max-width:1350px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
.head h2{margin:0;font-size:22px}
.badge{background:var(--ink);color:#fff;font-weight:700;padding:3px 9px;border-radius:5px;font-size:13px}
.intro{color:var(--mut);margin:4px 0 14px;max-width:820px;line-height:1.45}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.shot{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 6px 24px #0002;background:#fff;user-select:none}
.shot img{display:block;width:100%;height:auto}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-weight:900;font-size:clamp(70px,16vw,220px);color:#e8541e;opacity:.13;transform:rotate(-18deg);letter-spacing:4px}
.wmtag{position:absolute;top:8px;right:8px;background:#e8541ee6;color:#fff;font-weight:700;font-size:12px;padding:4px 8px;border-radius:4px;pointer-events:none}
.hs{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:22px;padding:0 5px;border-radius:11px;border:2px solid #fff;background:var(--acc2);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px #0005;transition:transform .12s}
.hs:hover,.hs.sel{transform:translate(-50%,-50%) scale(1.25);background:var(--acc);z-index:5}
.hs.nav{background:#5b6573}
body.exo .hs{background:#ffffff00;border-color:#1f6feb88;color:transparent;box-shadow:none}
body.exo .hs:hover{background:#1f6feb33}
body.exo .hs.good{background:var(--ok);color:#fff;border-color:#fff}
body.exo .hs.bad{background:#c62828;color:#fff;border-color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.panel h3{margin:0 0 6px;font-size:15px}
.panel .ref{display:inline-block;background:var(--acc2);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:6px}
.panel p{margin:6px 0;line-height:1.45;font-size:14px}
.tip{background:#fff5e8;border-left:3px solid var(--acc);padding:7px 9px;font-size:13px;border-radius:0 4px 4px 0;margin-top:8px}
.todo{background:#eef3ff;border-left:3px solid var(--acc2);padding:7px 9px;font-size:12.5px;border-radius:0 4px 4px 0;margin-top:8px;color:#26407a}
.list{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;cursor:pointer;line-height:1.35}
.item:hover{border-color:var(--acc2)}
.item b{color:var(--acc2);margin-right:5px}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 22px}
.step{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:150px;max-width:220px;font-size:13px;line-height:1.4}
.step b{display:block;font-size:14px;margin-bottom:3px}
.arrow{font-size:22px;color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card img{width:100%;border-radius:4px;display:block;margin-bottom:6px}
.card span{font-size:13px}
.btn{background:var(--acc);color:#fff;border:0;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px}
.btn.alt{background:var(--ink)}
.exobar{display:none;background:var(--ink);color:#fff;border-radius:8px;padding:12px 14px;margin-bottom:12px;gap:12px;align-items:center;flex-wrap:wrap}
body.exo .exobar{display:flex}
.exobar .q{flex:1;min-width:220px;font-size:15px}
.exobar .q small{display:block;color:#aab;font-size:12px;margin-bottom:2px}
.exobar .msg{font-size:13px;color:#ffd08a;width:100%}
.prog{height:5px;background:#ffffff22;border-radius:3px;width:100%;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.mobnav{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 aside{display:none}
 main{padding:14px 12px 50px}
 .stage{grid-template-columns:1fr}
 .panel{position:static;max-height:none}
 .hs{min-width:20px;height:18px;font-size:9px;border-width:1.5px}
}
.shot{container-type:inline-size}
.hs.off{background:#8a8f96;opacity:.9}
.zone{position:absolute;background:rgba(70,70,70,.55);border-radius:4px;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
.zone span{background:#333;color:#fff;font-size:max(8px,.75cqw);padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap}
.job{position:absolute;left:5.3%;right:5.3%;top:33.8%;height:2.6%;overflow:hidden;background:#cfe6ff;border:1px solid #7fb2ec;display:flex;align-items:center;font-size:.92cqw;color:#111;cursor:pointer}
.job:hover{background:#b9dbff}
.job>*{position:absolute;white-space:nowrap}
.job img{height:90%;width:auto;top:5%}
.warn{background:#fdecea;border-left:3px solid #c62828;padding:7px 9px;font-size:13px;border-radius:0 4px 4px 0;margin-top:8px;color:#8a1c1c}
.ok{background:#e8f6ee;border-left:3px solid var(--ok);padding:7px 9px;font-size:13px;border-radius:0 4px 4px 0;margin-top:8px}
/* Fenêtre Windows recréée */

.dlg{position:absolute;left:0;top:0;width:900px;height:600px;transform-origin:0 0;background:#f0f0f0;font:12px "Segoe UI",Tahoma,sans-serif;color:#000;border:1px solid #888}
.dlg .tb{height:30px;background:#fff;display:flex;align-items:center;padding:0 8px;gap:8px;border-bottom:1px solid #ddd}

.dlg .tb .x{margin-left:auto;font-size:16px;padding:0 10px;cursor:pointer}
.dlg .lk{position:absolute;left:20px;top:46px;display:flex;gap:8px;align-items:center}
.dlg .sel{border:1px solid #aaa;background:#fff;height:22px;display:flex;align-items:center;padding:0 6px;justify-content:space-between}
.dlg .side{position:absolute;left:14px;top:84px;width:100px;height:350px;background:#fff;border:1px solid #ccc;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px}
.dlg .side div{text-align:center;font-size:11px}
.dlg .side i{display:block;font-style:normal;font-size:24px}
.dlg .files{position:absolute;left:122px;top:84px;width:520px;height:350px;background:#fff;border:1px solid #ccc;overflow:hidden}
.dlg .fh,.dlg .fr{display:grid;grid-template-columns:1fr 70px 130px;padding:3px 8px;align-items:center}
.dlg .fh{color:#4c607a;border-bottom:1px solid #e5e5e5}
.dlg .fr{cursor:default}
.dlg .fr:hover{background:#e5f3ff}
.dlg .fr.s{background:#cce8ff}
.dlg .fr span:first-child{display:flex;align-items:center;gap:6px}
.dlg .btn9{position:absolute;left:660px;width:200px;height:26px;border:1px solid #adadad;background:#e1e1e1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dlg .btn9:hover{background:#e5f1fb;border-color:#0078d7}
.dlg .pv{position:absolute;left:660px;top:156px;width:200px;height:170px;border:1px solid #ccc;background:#fafafa}
.dlg .cks{position:absolute;left:660px;top:340px;display:flex;flex-direction:column;gap:7px}
.dlg .cks label{display:flex;gap:6px;align-items:center}
.dlg .row{position:absolute;left:122px;display:flex;align-items:center;gap:10px}
.dlg .row b{font-weight:400;width:110px}
.dlg .toast{position:absolute;left:122px;top:440px;color:#c62828;font-size:12px}
body.exo .dlg .hs{display:none}
.wlist{border:1px solid #7a9cc6;margin:10px 0;font:13px "Segoe UI",sans-serif;background:#fff}
.wo{padding:3px 8px;cursor:pointer}
.wo:hover{background:#e5f1fb}
.wo.on{background:#0078d7;color:#fff}
.wo.dis{color:#aaa;cursor:default}
.wo i{font-size:11px}
.wdemo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wdemo div{border:2px solid var(--line);border-radius:6px;padding:5px;font-size:12px;line-height:1.3}
.wdemo div.on{border-color:var(--acc)}
.wdemo svg{width:100%;display:block;border-radius:3px;margin-bottom:4px}
.wdemo b{display:block}
.wdemo span{color:var(--mut)}
.hs{z-index:3}
.t5area{position:absolute;overflow:hidden;z-index:2}
.t5sel{position:absolute;border:2px dashed #e8541e;box-shadow:0 0 0 2000px rgba(20,20,30,.55);box-sizing:border-box}
.t5lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000a;color:#fff;font-size:max(9px,1cqw);padding:4px 7px;border-radius:4px;text-align:center;white-space:nowrap;pointer-events:none}
.t5lab.bad{background:#c62828}
.t5h{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;background:#e8541e;border:2px solid #fff;border-radius:3px;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px #0006}
.t5h[data-k=ne],.t5h[data-k=sw]{cursor:nesw-resize}
.t5m{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#999;border:1px solid #fff;cursor:not-allowed}
.t9ck,.t9row{position:absolute;z-index:2;cursor:pointer}
.t9ck i,.t9row i{position:absolute;left:0;top:50%;transform:translateY(-50%);width:max(9px,1cqw);height:max(9px,1cqw);background:#fff;border:1px solid #333;font-style:normal;font-size:max(8px,.9cqw);line-height:1;display:flex;align-items:center;justify-content:center;color:#0a0}
.t9ck:hover,.t9row:hover{background:#1f6feb22}
.t9row.on{background:#1f6feb33}
.t9row.dis{cursor:default;background:#ffffff99}
.t9row.dis:hover{background:#ffffff99}
.t9pv{position:absolute;z-index:2;background:#fff}
.t9pv img{width:100%;height:100%;display:block}
.t9pv span{position:absolute;left:4px;right:4px;bottom:4px;background:#000b;color:#fff;font-size:max(9px,1cqw);padding:3px 6px;border-radius:3px}
.t9hint{position:absolute;z-index:2;color:#e8541e;font-weight:700;font-size:max(9px,1.1cqw);display:flex;align-items:center}
.toptabs{display:flex;gap:6px;margin:-6px 0 16px;border-bottom:2px solid var(--line)}
.tt{background:none;border:0;padding:9px 16px;font-size:15px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tt.on{color:var(--ink);border-bottom-color:var(--acc)}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:8px}
.acard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.acard:hover{border-color:var(--acc)}
.acard.dis{opacity:.5;cursor:default}
.acard b{display:block;margin-top:6px}
.acard span{font-size:13px;color:var(--mut)}
.aimg{position:relative}
.aimg img{width:100%;display:block;border-radius:6px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#e8541ee6;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0005}
.ap{position:relative;width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 24px #0002;container-type:inline-size}
.ap>img{width:100%;height:100%;display:block;object-fit:fill}
.ap .dlgwrap{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.acur{position:absolute;width:max(16px,2.2cqw);height:max(16px,2.2cqw);margin:-2px 0 0 -3px;z-index:6;pointer-events:none;display:none;filter:drop-shadow(0 2px 2px #0006)}
.acur.clk::after{content:"";position:absolute;left:-60%;top:-60%;width:120%;height:120%;border-radius:50%;border:3px solid #e8541e;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.aring{position:absolute;width:max(30px,4.5cqw);height:max(30px,4.5cqw);margin-left:calc(max(30px,4.5cqw)/-2);margin-top:calc(max(30px,4.5cqw)/-2);border:3px solid #e8541e;border-radius:50%;z-index:5;pointer-events:none;display:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.55}}
.aaucun{position:absolute;background:#fff;border:1px solid #0078d7;font:max(8px,1cqw) "Segoe UI",sans-serif;display:flex;align-items:center;padding-left:4px;z-index:4;box-shadow:0 0 0 3px #e8541e88}
.acap{background:var(--ink);color:#fff;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:16px;line-height:1.4;min-height:48px}
.actl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.alist{margin:6px 0 0;padding-left:22px}

.alist li:hover{background:#f0eee8}
.alist li.on{background:#fff0e8;color:var(--acc);font-weight:700}
.aend{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2cqw;background:linear-gradient(135deg,#fff7f0,#eef4ff)}
.aend div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:2cqw;text-align:center;font-size:max(11px,1.6cqw)}
.aend b{display:block;font-size:max(12px,1.9cqw)}
.aend i{font-style:normal;font-size:4cqw;color:var(--acc)}

.alst{position:absolute;z-index:4;background:#fff;border:1px solid #0078d7;font:max(8px,1cqw) "Segoe UI",sans-serif;box-shadow:0 3px 8px #0004}

.alst div.h{background:#0078d7;color:#fff}

.wprev{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-top:6px}

 .mhead{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:25;background:var(--side);color:#fff;padding:8px 10px}
 .mhead button{background:#ffffff1a;border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer}
 #mtitle{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .drawer{display:block;position:fixed;top:0;left:0;bottom:0;width:84%;max-width:330px;background:var(--side);color:#e8e8e8;z-index:40;transform:translateX(-105%);transition:transform .22s;overflow:auto;padding:10px}
 body.dopen .drawer{transform:none}
 .dmask{display:block;position:fixed;inset:0;background:#0007;z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
 body.dopen .dmask{opacity:1;pointer-events:auto}
 .dhead{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}
 .dhead button{background:#ffffff1a;border:0;color:#fff;width:36px;height:36px;border-radius:8px;font-size:16px}
 .dtabs{display:flex;gap:4px;margin-bottom:8px}
 .dtabs .tt{flex:1;color:#cfd3d8;border:0;background:#ffffff12;border-radius:8px;margin:0;padding:9px 4px;font-size:13px}
 .dtabs .tt.on{background:var(--acc);color:#fff}
 .drawer .navbtn{padding:10px 8px;font-size:14px}
 .toptabs{display:none}
 .sw{overflow-x:auto;-webkit-overflow-scrolling:touch}
 body.zoom .sw .shot,body.zoom .sw .dlgwrap{width:240%}
 .stage.scr .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:46vh;border-radius:14px 14px 0 0;z-index:30;transform:translateY(110%);transition:transform .2s;box-shadow:0 -6px 24px #0003;padding-top:16px}
 body.sheet .stage.scr .panel{transform:none}
 .sclose{display:block;position:absolute;right:10px;top:8px;border:0;background:#eee;border-radius:50%;width:30px;height:30px;font-size:14px}
 .stage.scr{margin-bottom:8px}
 .hs{min-width:18px;height:16px;font-size:8px}
 .head h2{font-size:18px}
 .intro{font-size:14px}
 .list{grid-template-columns:1fr 1fr;gap:6px}
 .item{font-size:12px;padding:7px 8px}
 .actl label{margin-left:0;width:100%}
 .wa{min-height:0;padding:14px 8px 44px}
 .flow{flex-direction:column;align-items:stretch;gap:4px}
 .flow .step{max-width:none}
 .flow .arrow{transform:rotate(90deg);align-self:center;line-height:1}
 .acards,.cards{grid-template-columns:1fr 1fr}
}

const pctBox=(s,x0,y0,x1,y1)=>`left:${x0/s.w*100}%;top:${y0/s.h*100}%;width:${(x1-x0)/s.w*100}%;height:${(y1-y0)/s.h*100}%`;

 const hl=document.createElement("div"); hl.className="t5area"; hl.style.cssText=pctBox(s,689,289,1153,637)+";overflow:visible";
 shot.appendChild(area); shot.appendChild(hl);
 const sel=document.createElement("div"); sel.className="t5sel"; area.appendChild(sel);
 const lab=document.createElement("div"); lab.className="t5lab"; sel.appendChild(lab);
 const H={}; ["nw","ne","sw","se"].forEach(k=>{const h=document.createElement("div");h.className="t5h";h.dataset.k=k;hl.appendChild(h);H[k]=h;});
 const M={}; ["n","s","e","w"].forEach(k=>{const h=document.createElement("div");h.className="t5m";h.title="Angles uniquement";hl.appendChild(h);M[k]=h;
   h.onpointerdown=ev=>{ev.preventDefault();lab.innerHTML="⚠️ Angles uniquement !";lab.classList.add("bad");setTimeout(()=>{lab.classList.remove("bad");draw()},1200)};});
 function draw(){
  const {x0,y0,x1,y1}=T5S; const P=v=>v*100+"%";
  Object.assign(sel.style,{left:P(x0),top:P(y0),width:P(x1-x0),height:P(y1-y0)});
  const pos={nw:[x0,y0],ne:[x1,y0],sw:[x0,y1],se:[x1,y1]};
  for(const k in H){H[k].style.left=P(pos[k][0]);H[k].style.top=P(pos[k][1]);}
  const mid={n:[(x0+x1)/2,y0],s:[(x0+x1)/2,y1],e:[x1,(y0+y1)/2],w:[x0,(y0+y1)/2]};
  for(const k in M){M[k].style.left=P(mid[k][0]);M[k].style.top=P(mid[k][1]);}
  const full=(x1-x0>.999&&y1-y0>.999);

 }
 for(const k in H){

   ev.preventDefault(); H[k].setPointerCapture(ev.pointerId);
   const r=area.getBoundingClientRect();
   H[k].onpointermove=e=>{
    let fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), fy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)), m=.08;
    if(k[1]=="w") T5S.x0=Math.min(fx,T5S.x1-m); else T5S.x1=Math.max(fx,T5S.x0+m);
    if(k[0]=="n") T5S.y0=Math.min(fy,T5S.y1-m); else T5S.y1=Math.max(fy,T5S.y0+m);
    draw();
   };
   H[k].onpointerup=()=>{H[k].onpointermove=null;};
  };
 }
 draw();
}

ANIMS.anim2={title:"Impression couleur + blanc",intro:"Avec une couche de blanc en mode Sous-uni.",sc:ANIM2};
ANIMS.anim1={title:"Impression couleur simple",intro:"De l'image au fichier RIPé, sans blanc.",sc:ANIM1};
let A={key:"anim1",sc:0,st:0,timer:null,playing:false,speed:1,f:null,j:0,a:0};
const AN=()=>ANIMS[A.key].sc;
function animStop(){clearTimeout(A.timer);A.playing=false;clearTimeout(WA.timer);WA.playing=false;}
function renderAnim(){
 $("#view").innerHTML=`
 <div class="head"><span class="badge">▶</span><h2>Animation : ${ANIMS[A.key].title.toLowerCase()}</h2></div>
 <p class="intro">${ANIMS[A.key].intro} Clique sur Lecture, ou sur une étape pour y aller directement.</p>
 <div class="stage"><div>
  <div class="ap" id="ap"></div>
  <div class="acap" id="acap"></div>
  <div class="actl"><button class="btn" id="aplay">▶ Lecture</button><button class="btn alt" id="aprev">⏮</button><button class="btn alt" id="anext">⏭</button><button class="btn alt" id="arestart">↺ Recommencer</button>
  <label>Vitesse <input type="range" id="aspeed" min="0.25" max="2" step="0.25" value="${A.speed}"> <span id="aspv">×${A.speed}</span></label></div>
 </div><div class="panel"><h3>Étapes</h3><ol class="alist" id="alist">${AN().map((s,i)=>`<li data-sc="${i}">${s.t}</li>`).join("")}</ol></div></div>`;
 $("#aplay").onclick=()=>A.playing?animPause():animPlay();
 $("#aprev").onclick=()=>animGoto(Math.max(0,A.sc-1));
 $("#anext").onclick=()=>animGoto(Math.min(AN().length-1,A.sc+1));
 $("#arestart").onclick=()=>{animGoto(0);animPlay();};
 $("#aspeed").oninput=e=>{A.speed=+e.target.value;$("#aspv").textContent="×"+A.speed;};
 document.querySelectorAll("#alist li").forEach(li=>li.onclick=()=>{animGoto(+li.dataset.sc);animPlay();});
 animGoto(A.sc,true);
}
function animScreen(k){
 const ap=$("#ap"); if(!ap) return; ap.dataset.scr=k;
 let inner;
 if(k=="end") inner=`<div class="aend"><div><b>📄 Fichier RIPé</b><span>smiley</span></div><i>→</i><div><b>💻 Logiciel DXonJet</b><span>ouvre le fichier</span></div><i>→</i><div><b>🧱 Le mur</b><span>impression</span></div></div>`;
 else if(k=="m0a"||k=="tenv"){ fileSel=A.f; inner=`<div class="dlgwrap" style="border-radius:0;box-shadow:none"><div class="dlg" id="adlg">${k=="tenv"?envHTML():dlgHTML()}</div></div>`; }
 else { const s=S[k]; inner=`<img src="${s.img}" alt="">`; if(k=="m0"&&A.j){jobDone=false;inner+=jobHTML();} if(k=="t4"&&A.o){ const o=["Aucun","Couleur d'accompagnement","Sous-couleur","Couleur de remplissage","Support","Sous-uni","Remplir le substrat"]; inner+=`<div class="aaucun" style="left:${188/s.w*100}%;top:${357/s.h*100}%;width:${160/s.w*100}%;height:${20/s.h*100}%;box-shadow:none">Couleur d'accompagnement</div><div class="alst" style="left:${188/s.w*100}%;top:${377/s.h*100}%;min-width:${160/s.w*100}%">${o.map((x,i)=>`<div class="${i==A.hl?'h':''}">${x}</div>`).join("")}</div>`; }
 if(k=="t4"&&A.a) inner+=`<div class="aaucun" style="left:${188/s.w*100}%;top:${357/s.h*100}%;width:${160/s.w*100}%;height:${20/s.h*100}%">${A.wm}</div>`;
 if(k=="t9"&&A.t9){ inner+=`<div class="aaucun" style="left:${104/s.w*100}%;top:${180/s.h*100}%;width:${14/s.w*100}%;height:${14/s.h*100}%;padding:0;justify-content:center;box-shadow:none;color:#0a0">✓</div>`;
   if(A.t9==2) inner+=`<div class="t9pv" style="left:${666/s.w*100}%;top:${332/s.h*100}%;width:${517/s.w*100}%;height:${389/s.h*100}%"><img src="img/w_${WM[A.wm][0]}.png" alt=""><span>Spot_1 = blanc · le noir montre où le blanc sera imprimé</span></div><div class="aaucun" style="left:${104/s.w*100}%;top:${296/s.h*100}%;width:${314/s.w*100}%;height:${17/s.h*100}%;background:#1f6feb33;border:0;box-shadow:none"></div><div class="aaucun" style="left:${106/s.w*100}%;top:${230/s.h*100}%;width:${12/s.w*100}%;height:${12/s.h*100}%;padding:0;border:1px solid #555;box-shadow:none"></div><div class="aaucun" style="left:${106/s.w*100}%;top:${298/s.h*100}%;width:${12/s.w*100}%;height:${12/s.h*100}%;padding:0;border:1px solid #555;box-shadow:none;justify-content:center;color:#0a0">✓</div>`; } }
 if(A.pop) inner+=wpopHTML(A.pop,true);
 ap.innerHTML=inner+`<div class="aring" id="aring"></div><div class="acur" id="acur"><svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg></div>`;
 const ar=k=="end"?1210/600:(k=="m0a"||k=="tenv")?900/600:S[k].w/S[k].h; ap.style.aspectRatio=ar;
 const d=$("#adlg"); if(d){const fit=()=>{d.style.transform=`scale(${ap.clientWidth/900})`};fit();}
 ap.querySelectorAll("img").forEach(im=>im.style.pointerEvents="none");
}
function animPt(x,y){const k=$("#ap").dataset.scr; const W=(k=="m0a"||k=="tenv")?900:S[k]?.w||1210, H=(k=="m0a"||k=="tenv")?600:S[k]?.h||600; return [x/W*100,y/H*100];}
function animEff(step){
 const e=step.eff; if(!e) return;
 if(e=="f"){A.f="smiley.jpg";} if(e=="j"){A.j=1;} if(e=="a"){A.a=1;A.o=0;A.wm=step.val||"Aucun";} if(e=="o"){A.o=1;A.hl=step.hl||0;}
 if(e=="t9"){A.t9=1;} if(e=="t9w"){A.t9=2;} if(e=="pop"){A.pop=step.val;} if(e=="popclose"){A.pop=null;}
}
function animRedraw(scr){ const c=$("#acur"); const p=[c.style.left,c.style.top]; animScreen(scr); const c2=$("#acur"); c2.style.transition="none"; c2.style.left=p[0]; c2.style.top=p[1]; c2.style.display="block"; }
function animApply(step,instant){
 const c=$("#acur"), r=$("#aring"), dur=instant?0:Math.round(700/A.speed);
 if(step.cap!==undefined) $("#acap").textContent=step.cap;
 let pos=null;
 if(step.cur) pos=animPt(...step.cur);
 if(step.sel){ const ap=$("#ap"), el=ap.querySelector(step.sel); if(el){ const R1=ap.getBoundingClientRect(), R2=el.getBoundingClientRect(); pos=[(R2.left+R2.width*(step.fx||.5)-R1.left)/R1.width*100,(R2.top+R2.height*(step.fy||.5)-R1.top)/R1.height*100]; } }
 if(pos){ const [x,y]=pos; c.style.transition=`left ${dur}ms ease, top ${dur}ms ease`; c.style.left=x+"%"; c.style.top=y+"%"; c.style.display="block";
   r.style.display="none"; if(step.ring){ setTimeout(()=>{r.style.left=x+"%";r.style.top=y+"%";r.style.display="block";},dur); } }
 if(!step.click && step.eff){ animEff(step); animRedraw($("#ap").dataset.scr); }
 if(step.click){ c.classList.remove("clk"); void c.offsetWidth; c.classList.add("clk");
   setTimeout(()=>{ animEff(step);
     if(step.go) animRedraw(step.go); else if(step.eff) animRedraw($("#ap").dataset.scr);
   }, instant?0:Math.round(250/A.speed)); }
}
function animGoto(i,noPlay){
 clearTimeout(A.timer); A.sc=i; A.st=0; const sc=AN()[i]; A.f=sc.st.f; A.j=sc.st.j; A.a=sc.st.a; A.o=0; A.wm=sc.st.wm||"Aucun"; A.hl=0; A.t9=sc.st.t9||0; A.pop=null;
 animScreen(sc.scr); const c=$("#acur"); if(c){c.style.left="50%";c.style.top="55%";c.style.display=sc.scr=="end"?"none":"block";}
 $("#acap").textContent=sc.steps[0].cap||"";
 document.querySelectorAll("#alist li").forEach((li,k)=>li.classList.toggle("on",k==i));
 if(A.playing && !noPlay) animTick();
}
function animTick(){
 const sc=AN()[A.sc]; if(!sc) return;
 if(A.st>=sc.steps.length){ if(A.sc<AN().length-1){ animGoto(A.sc+1,true); A.timer=setTimeout(animTick,Math.round(500/A.speed)); } else { animPause(); $("#aplay").textContent="↺ Revoir"; } return; }
 const step=sc.steps[A.st++]; animApply(step);
 A.timer=setTimeout(animTick,Math.round((step.d||1500)/A.speed));
}
function animPlay(){ if(A.sc==AN().length-1 && A.st>=AN()[A.sc].steps.length) animGoto(0,true); A.playing=true; $("#aplay").textContent="⏸ Pause"; animTick(); }
function animPause(){ clearTimeout(A.timer); A.playing=false; const b=$("#aplay"); if(b) b.textContent="▶ Lecture"; }
// ===== Animation : les réglages du blanc =====
const WSC=[
 {k:null,t:"Introduction",cap:"Le blanc sert de sous-couche : il permet aux couleurs de bien ressortir sur un mur foncé. Voyons les 7 réglages possibles, choisis en T4."},
 {k:"aucun",t:"Aucun",cap:"Aucun : pas de blanc. Les couleurs se mélangent avec le mur et paraissent sombres."},
 {k:"support",t:"Support",cap:"Support : du blanc sur toute l'image. On voit un rectangle blanc sur le mur, avec l'image dedans."},
 {k:"sousuni",t:"Sous-uni",cap:"Sous-uni : du blanc uniforme sous tous les pixels de couleur. Le mur reste visible autour du dessin."},
 {k:"souscouleur",t:"Sous-couleur",cap:"Sous-couleur : plus la couleur est foncée, plus il y a de blanc dessous."},
 {k:"remplissage",t:"Couleur de remplissage",cap:"Couleur de remplissage : plus la couleur est claire, plus il y a de blanc, y compris dans le fond."},
 {k:"substrat",t:"Remplir le substrat",cap:"Remplir le substrat : plus la couleur est claire, plus il y a de blanc, mais pas là où il y a du vide."},
 {k:"accomp",t:"Couleur d'accompagnement",cap:"Couleur d'accompagnement : permet d'avoir du blanc uniquement là où on le décide. Le blanc vient d'un calque préparé dans Photoshop : c'est le niveau expert."}
];
let WA={i:0,playing:false,timer:null,speed:1};
function renderW(){
 $("#view").innerHTML=`
 <div class="head"><span class="badge">▶</span><h2>Animation : les réglages du blanc</h2></div>
 <p class="intro">Les 7 façons d'imprimer le blanc, choisies en T4 sur la ligne Spot_1. Résultats simulés sur un mur foncé.</p>
 <div class="wa" id="wa"></div>
 <div class="acap" id="wcap"></div>
 <div class="wchips" id="wchips">${WSC.map((s,i)=>`<button data-i="${i}">${i?i+". ":""}${s.t}</button>`).join("")}</div>
 <div class="actl"><button class="btn" id="wplay">▶ Lecture</button><button class="btn alt" id="wprev">⏮</button><button class="btn alt" id="wnext">⏭</button><button class="btn alt" id="wre">↺ Recommencer</button>
 <label>Vitesse <input type="range" id="wspeed" min="0.25" max="2" step="0.25" value="${WA.speed}"> <span id="wspv">×${WA.speed}</span></label></div>`;
 $("#wplay").onclick=()=>WA.playing?wPause():wPlay();
 $("#wprev").onclick=()=>wShow(Math.max(0,WA.i-1));
 $("#wnext").onclick=()=>wShow(Math.min(WSC.length-1,WA.i+1));
 $("#wre").onclick=()=>{wShow(0);wPlay();};
 $("#wspeed").oninput=e=>{WA.speed=+e.target.value;$("#wspv").textContent="×"+WA.speed;};
 document.querySelectorAll("#wchips button").forEach(b=>b.onclick=()=>{wShow(+b.dataset.i);});
 wShow(WA.i);
}
function wShow(i){
 clearTimeout(WA.timer); WA.i=i; const s=WSC[i], wa=$("#wa"); if(!wa) return;
 const wipe=Math.round(2600/WA.speed);
 if(!s.k){
  wa.innerHTML=`<div class="wintro"><div class="wl"><span class="l1">🎨 Couleur</span><span class="l2">⬜ Blanc (sous-couche)</span><span class="l3">🧱 Mur foncé</span></div>
   <div class="wcmp"><figure><img src="img/r_aucun.png" alt=""><figcaption>Sans blanc</figcaption></figure><figure><img src="img/r_sousuni.png" alt=""><figcaption>Avec blanc</figcaption></figure></div></div>`;
 } else {
  wa.innerHTML=`<figure><img src="img/o_smiley.png" alt="" class="wo1"><figcaption>1. Image d'origine</figcaption></figure>
   <span class="warr">→</span>
   <figure><div class="wwipe"><img src="img/pw_${s.k}.png" alt="" style="animation-duration:${wipe}ms"></div><figcaption>2. Aperçu dans le logiciel<br><small>noir = blanc imprimé</small></figcaption></figure>
   <span class="warr">→</span>
   <figure><div class="wwipe wres"><img src="img/r_aucun.png" alt=""><img src="img/r_${s.k}.png" alt="" class="top" style="animation-duration:${wipe}ms"></div><figcaption>3. Résultat sur un mur foncé</figcaption></figure>
   <div class="wname">${s.t}${WTAG[s.t]?` <i class="wt">${WTAG[s.t]}</i>`:''}</div>`;
 }
 $("#wcap").textContent=s.cap;
 document.querySelectorAll("#wchips button").forEach((b,k)=>b.classList.toggle("on",k==i));
 if(WA.playing) WA.timer=setTimeout(()=>{ if(WA.i<WSC.length-1) wShow(WA.i+1); else {wPause();$("#wplay").textContent="↺ Revoir";} }, Math.round(8000/WA.speed));
}
function wPlay(){ if(WA.i==WSC.length-1) WA.i=0; WA.playing=true; $("#wplay").textContent="⏸ Pause"; wShow(WA.i); }
function wPause(){ clearTimeout(WA.timer); WA.playing=false; const b=$("#wplay"); if(b) b.textContent="▶ Lecture"; }
// Exercice
function startExo(){exo={i:0,err:0};jobAdded=false;fileSel=null;document.body.classList.add("exo");showExo();go("m0");}
function showExo(msg){
 const e=EXO[exo.i];
 $("#exoq").innerHTML=`<small>Étape ${exo.i+1} / ${EXO.length}</small>${e.q}`;
 $("#exoprog").style.width=(exo.i/EXO.length*100)+"%";
 $("#exomsg").textContent=msg||"";
}
function checkExo(id){
 const e=EXO[exo.i], el=document.querySelector(`.hs[data-id="${id}"]`);
 const onScreen = e.s=="T*" ? cur[0]=="t" : cur==e.s;
 if(onScreen && id==e.id){
  el&&el.classList.add("good"); exo.i++;
  if(e.id=="a.8") jobAdded=true;
  if(exo.i>=EXO.length){setTimeout(endExo,500);return;}
  setTimeout(()=>{showExo("✅ Bravo !"); e.then?go(e.then):render();},500);
 } else {
  exo.err++; el&&el.classList.add("bad"); setTimeout(()=>el&&el.classList.remove("bad"),700);
  $("#exomsg").textContent= !onScreen ? "❌ Pas sur cet écran. Change d'onglet ou d'écran." : "❌ Pas cette zone, essaie encore.";
 }
}
function endExo(){
 const n=EXO.length, sc=Math.max(0,Math.round(100-exo.err*100/(n*2)));
 document.body.classList.remove("exo"); exo=null; cur="home"; renderNav();
 $("#view").innerHTML=`<div class="head"><span class="badge">E1</span><h2>Exercice terminé 🎉</h2></div>
 <p class="intro">Score : <b>${sc} %</b> (${n} étapes). Tu connais le chemin complet : ajouter le fichier → ouvrir ses propriétés → taille → passes → profil → blanc → vérifier → envoyer.</p>
 <p><button class="btn" id="re">Recommencer</button> <button class="btn alt" id="ho">Accueil</button></p>`;
 $("#re").onclick=startExo; $("#ho").onclick=()=>go("home");
}
$("#exohint").onclick=()=>{$("#exomsg").textContent="💡 "+EXO[exo.i].hint;exo.err+=0.5};
$("#exoquit").onclick=()=>{exo=null;document.body.classList.remove("exo");go("home")};
renderNav(); render();
</script>
